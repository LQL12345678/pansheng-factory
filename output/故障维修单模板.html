<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>故障维修单模板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 24px; margin-bottom: 5px; }
        .header p { color: #666; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #333; padding: 10px; font-size: 14px; }
        th { background: #f5f5f5; width: 120px; text-align: center; }
        input, textarea, select { width: 100%; border: none; outline: none; font-size: 14px; font-family: inherit; }
        textarea { resize: vertical; min-height: 60px; }
        .section-title { background: #e8e8e8; font-weight: bold; text-align: center; }
        .signature { margin-top: 40px; display: flex; justify-content: space-around; }
        .signature-item { text-align: center; }
        .signature-line { border-bottom: 1px solid #333; width: 150px; margin: 40px auto 5px; }
        @media print {
            body { padding: 0; }
            button { display: none; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>设备故障维修单</h1>
        <p>工单号：<input type="text" placeholder="自动生成" style="width: 150px; border-bottom: 1px solid #333;" /></p>
    </div>

    <table>
        <tr>
            <th>设备编号</th>
            <td><input type="text" placeholder="请输入设备编号" /></td>
            <th>设备名称</th>
            <td><input type="text" placeholder="请输入设备名称" /></td>
        </tr>
        <tr>
            <th>设备位置</th>
            <td><input type="text" placeholder="请输入设备位置" /></td>
            <th>所属产线</th>
            <td><input type="text" placeholder="请输入产线" /></td>
        </tr>
        <tr>
            <th>报修日期</th>
            <td><input type="date" /></td>
            <th>报修时间</th>
            <td><input type="time" /></td>
        </tr>
        <tr>
            <th>报修人</th>
            <td><input type="text" placeholder="请输入报修人" /></td>
            <th>维修人</th>
            <td><input type="text" placeholder="请输入维修人" /></td>
        </tr>
        <tr>
            <th class="section-title" colspan="4">故障信息</th>
        </tr>
        <tr>
            <th>故障类型</th>
            <td colspan="3">
                <select>
                    <option value="">请选择</option>
                    <option>电气故障</option>
                    <option>机械故障</option>
                    <option>软件故障</option>
                    <option>其他</option>
                </select>
            </td>
        </tr>
        <tr>
            <th>故障描述</th>
            <td colspan="3"><textarea placeholder="请详细描述故障现象"></textarea></td>
        </tr>
        <tr>
            <th>故障原因</th>
            <td colspan="3"><textarea placeholder="请填写故障原因分析"></textarea></td>
        </tr>
        <tr>
            <th class="section-title" colspan="4">维修信息</th>
        </tr>
        <tr>
            <th>处理方式</th>
            <td colspan="3"><textarea placeholder="请填写维修处理方法和步骤"></textarea></td>
        </tr>
        <tr>
            <th>使用零件</th>
            <td colspan="3"><textarea placeholder="请填写使用的零件及数量"></textarea></td>
        </tr>
        <tr>
            <th>受理时间</th>
            <td><input type="datetime-local" /></td>
            <th>完成时间</th>
            <td><input type="datetime-local" /></td>
        </tr>
        <tr>
            <th>维修用时(分钟)</th>
            <td><input type="number" placeholder="请输入维修用时" /></td>
            <th>维修状态</th>
            <td>
                <select>
                    <option value="待处理">待处理</option>
                    <option value="处理中">处理中</option>
                    <option value="已完成">已完成</option>
                    <option value="挂起">挂起</option>
                </select>
            </td>
        </tr>
        <tr>
            <th>备注</th>
            <td colspan="3"><textarea placeholder="请填写备注信息"></textarea></td>
        </tr>
    </table>

    <div class="signature">
        <div class="signature-item">
            <div class="signature-line"></div>
            <div>报修人签名</div>
        </div>
        <div class="signature-item">
            <div class="signature-line"></div>
            <div>维修人签名</div>
        </div>
        <div class="signature-item">
            <div class="signature-line"></div>
            <div>确认人签名</div>
        </div>
    </div>

    <div style="text-align: center; margin-top: 30px;">
        <button onclick="window.print()" style="padding: 10px 30px; font-size: 16px; background: #1677ff; color: #fff; border: none; border-radius: 5px; cursor: pointer;">打印此页</button>
    </div>
</body>
</html>
